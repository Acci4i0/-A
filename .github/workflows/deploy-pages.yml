# Pubblica and-re.com su GitHub Pages a ogni push su main.
#
# Il sito non e' fatto di un repo solo: la cartella "foto" e la cartella "info"
# della home sono due progetti che vivono in repo separati, e vengono montati
# qui al momento del deploy invece di essere copiati dentro questo repo.
#
# Cosi' ogni progetto resta la fonte di verita' di se stesso (niente copie da
# tenere allineate a mano), questo repo resta leggero - il build della gallery
# da solo pesa 26 MB, che altrimenti finirebbero per sempre nella storia di git -
# e i due siti continuano a funzionare anche ai loro indirizzi originali.
#
# Il prezzo: il deploy della home passa da pochi secondi a un paio di minuti, e
# se il build della gallery si rompe non esce online nemmeno la home.
#
# ATTENZIONE alla Source di Pages. Se resta su "Deploy from a branch", GitHub
# lancia in parallelo anche la pipeline legacy "pages build and deployment", che
# pubblica il repo COSI' COM'E' - cioe' senza foto/ e info/, che qui non sono
# committate ma nascono durante il build. Finendo per ultima sovrascrive questo
# deploy, e i due percorsi rispondono 404.
#
# E' successo davvero al primo deploy. configure-pages con enablement:true non
# basta: enabla Pages se manca, ma non converte una configurazione gia' esistente
# da "branch" a "workflow", e nemmeno l'API col token del workflow ci riesce.
# Va impostato una volta a mano in Settings > Pages. Lo step qui sotto lo
# verifica e blocca il run se manca, invece di lasciar passare un deploy verde
# che pubblica un sito rotto.

name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # I due repo montati qui non sanno di questo sito: quando cambiano, il loro
  # deploy aggiorna solo il loro indirizzo. Per riflettere la modifica anche su
  # and-re.com va rilanciato questo workflow a mano (o si aggiunge un
  # repository_dispatch da quei repo).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout della home
        uses: actions/checkout@v4

      # Se la Source e' ancora "Deploy from a branch" questo deploy verra'
      # sovrascritto dalla pipeline legacy e /foto/ e /info/ risponderanno 404,
      # MA il run risultera' comunque verde: il modo peggiore di fallire.
      # Quindi si controlla e si ferma tutto subito, con le istruzioni.
      #
      # Non e' automatizzabile da qui: il token del workflow non riesce a
      # cambiare l'impostazione (provato con
      # `gh api -X PUT repos/$GITHUB_REPOSITORY/pages -f build_type=workflow`,
      # senza effetto). Va fatto una volta a mano.
      - name: Verifica che la Source di Pages sia "GitHub Actions"
        run: |
          TYPE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo sconosciuto)
          echo "build_type = $TYPE"
          if [ "$TYPE" = "legacy" ]; then
            echo "::error::La Source di Pages e' 'Deploy from a branch'. Con questa \
          impostazione GitHub pubblica il repo grezzo, che non contiene foto/ e info/ \
          (vengono montate qui durante il build), e sovrascrive questo deploy. \
          Vai su Settings > Pages > Build and deployment e metti Source: GitHub Actions."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # --- cartella "info": il cruciverba, statico puro, si copia com'e' ---
      - name: Checkout del cruciverba in info/
        uses: actions/checkout@v4
        with:
          repository: Acci4i0/crossword
          path: info

      # --- cartella "foto": la gallery, app Vite, va buildata ---
      # Il sorgente viene messo in una cartella temporanea e cancellato dopo aver
      # copiato il build: l'artifact carica '.', quindi qualunque cosa resti qui
      # dentro finirebbe pubblicata (sorgenti e node_modules compresi).
      - name: Checkout della gallery
        uses: actions/checkout@v4
        with:
          repository: Acci4i0/3Dgallery
          path: .gallery-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .gallery-src/package-lock.json

      - name: Build della gallery
        working-directory: .gallery-src
        run: |
          npm ci
          npm run build

      - name: Monta la gallery in foto/ e ripulisci
        run: |
          mkdir -p foto
          cp -r .gallery-src/dist/. foto/
          rm -rf .gallery-src
          # il .git dei repo montati non va pubblicato
          rm -rf info/.git

      - name: Controlla che il montaggio sia riuscito
        run: |
          test -f foto/index.html || { echo "manca foto/index.html"; exit 1; }
          test -f info/index.html || { echo "manca info/index.html"; exit 1; }
          test ! -e .gallery-src || { echo ".gallery-src non e' stato rimosso"; exit 1; }
          echo "foto/ $(du -sh foto | cut -f1)  |  info/ $(du -sh info | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
