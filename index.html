<!DOCTYPE html>
<html lang="en" class="page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>andre</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="msapplication-TileColor" content="#da532c">
  <link rel="stylesheet" href="style.css">

  <!-- ===== intro (preloader) =====
       Timeline ricostruita dalle misure in _analysis/REPORT.md:
       hold 2000ms, poi opacity 1 -> 0 in 1000ms con cubic-bezier(0, .95, .44, 1),
       fill forwards. Unica proprietà animata: opacity.
       Inline nel <head> perché il cover deve essere già stilizzato al primo paint. -->
  <style>
    :root {
      /* timeline. I primi due valori vengono dal video di riferimento, misurato
         fotogramma per fotogramma: il nome resta fermo ~1.9s, poi si disfa per
         ~8.6s con una progressione che accelera (la variazione per fotogramma
         passa dal 3% al 10.7%), infine resta fermo sullo stato finale. */
      --intro-hold-duration: 1900ms;
      --intro-melt-duration: 8600ms;
      --intro-fade-duration: 1000ms;
      --intro-fade-easing: cubic-bezier(0, 0.95, 0.44, 1);

      /* griglia e tipografia (misurate a 1281-1620px) */
      --intro-gutter: 3px;
      --intro-font-size: 14px;
      --intro-font-stack: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;

      /* Il font originale è un webfont proprietario non riutilizzabile: il fallback ha
         ascent/descent diversi, che con line-height:1 spostano la baseline di ~0.21em.
         Compensato qui in em così da restare corretto a ogni breakpoint (vedi DIFF.md). */
      --intro-baseline-nudge: -0.21em;

      /* Unica identità cromatica dell'intro: l'azzurro del sito, con la scritta
         in bianco sopra. Il colore vive solo qui e nessuno script lo tocca a
         runtime, quindi non esiste alcun percorso di codice che possa
         produrne un altro. */
      --intro-blue: #49A4F6;
      --intro-ink: #ffffff;
    }

    /* Breakpoint tipografici misurati sull'originale (vedi breakpoint-sweep.json) */
    @media (max-width: 666px) {
      :root { --intro-font-size: 15px; --intro-gutter: 4px; }
    }
    @media (min-width: 667px) and (max-width: 1280px) {
      :root { --intro-font-size: calc(8px + 7 * (100vw - 667px) / 613); }
    }
    @media (min-width: 1621px) {
      :root { --intro-font-size: 18px; }
    }

    .intro {
      position: fixed;
      inset: 0;
      min-height: 100vh;
      min-height: 100lvh;
      z-index: 1200;
      background: var(--intro-blue);
      color: var(--intro-ink);
      font-family: var(--intro-font-stack);
      font-size: var(--intro-font-size);
      font-weight: 400;
      line-height: 1;
      letter-spacing: normal;
      pointer-events: none;
      will-change: opacity;
      animation: intro-fade-out var(--intro-fade-duration) var(--intro-fade-easing)
                 calc(var(--intro-hold-duration) + var(--intro-melt-duration)) forwards;
    }

    @keyframes intro-fade-out {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* La riga parte esattamente a metà viewport, non è centrata su di esso. */
    .intro-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 50vh;
      margin-top: 50lvh;
      padding-inline: var(--intro-gutter);
      transform: translateY(var(--intro-baseline-nudge));
    }

    .intro-cell { padding-inline: var(--intro-gutter); }

    /* Il nome si disfa in verticale ma NON in orizzontale: nel video di
       riferimento il riquadro del testo resta largo esattamente uguale dal primo
       all'ultimo fotogramma (219..950 px), mentre l'altezza passa da 138 a 458.
       Le lettere quindi si allungano e slittano su e giù, ognuna per conto suo,
       senza mai spostarsi di lato. inline-block serve a poterle trasformare;
       will-change tiene ogni lettera sul suo layer. */
    .intro-glyph {
      display: inline-block;
      transform-origin: 50% 50%;
      white-space: pre;
      will-change: transform;
    }

    /* A fine corsa il layer non serve piu'. */
    .intro--retired .intro-glyph { will-change: auto; }

    /* Sotto i 667px l'originale passa a 2 colonne e nasconde la tagline centrale. */
    @media (max-width: 666px) {
      .intro-row { grid-template-columns: repeat(2, 1fr); }
      .intro-tagline { display: none; }
      .intro-year { text-align: right; }
    }

    /* Stato finale: invisibile e senza layer di composizione residuo. */
    .intro--retired { visibility: hidden; will-change: auto; }

    @media (prefers-reduced-motion: reduce) {
      .intro { animation: none; opacity: 0; }
      /* lo script non parte nemmeno, ma se una lettera fosse gia' stata
         trasformata questa la rimette a posto */
      .intro-glyph { transform: none !important; text-shadow: none !important; }
    }
  </style>

  <script>
    /* Ritira il cover a fine animazione. Del colore non si occupa: è fissato in
       CSS (--intro-blue) e nessuno lo cambia a runtime. */
    (() => {
      'use strict';

      const RETIRED_CLASS = 'intro--retired';

      retireCoverWhenFadeEnds();

      function retireCoverWhenFadeEnds() {
        whenDocumentIsParsed(() => {
          const cover = document.getElementById('intro');
          if (!cover) return;
          const retire = () => cover.classList.add(RETIRED_CLASS);
          if (prefersReducedMotion()) retire();
          else cover.addEventListener('animationend', retire, { once: true });
        });
      }

      function prefersReducedMotion() {
        return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      }

      function whenDocumentIsParsed(callback) {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', callback, { once: true });
        } else {
          callback();
        }
      }

      /* ===== disfacimento del nome =====
         Ricostruito dal video di riferimento invece di incorporarlo: il video e'
         nero su bianco e pesa 7.6 MB, qui serve bianco su azzurro. In codice
         resta nitido a ogni risoluzione, non costa un download e si spegne da
         solo con prefers-reduced-motion.

         Quello che il video fa, misurato fotogramma per fotogramma:
           - la banda del testo resta larga UGUALE dall'inizio alla fine
             (219..950 px), quindi niente si sposta di lato;
           - l'altezza passa da 138 a 458 px, cioe' x3.3: le lettere si allungano
             e slittano in verticale;
           - l'inchiostro passa dall'1.69% all'8.15%, x4.8 — piu' del solo
             allungamento, da cui la scia che ogni lettera si lascia dietro;
           - la variazione per fotogramma cresce dal 3% al 10.7%: il disfacimento
             accelera, e infatti la progressione qui e' elevata al cubo.

         Le misure sono tutte in EM, non in pixel: il corpo del testo dell'intro
         cambia col viewport (da 8px a 18px), e uno slittamento fisso in pixel
         darebbe una proporzione diversa a ogni larghezza di finestra. In em il
         rapporto x3.3 fra altezza finale e iniziale resta lo stesso ovunque. */

      const MELT_MAX_STRETCH = 1.60;  // quanto si allunga in piu' (scaleY)
      const MELT_MAX_DRIFT_EM = 0.58; // slittamento verticale massimo, in em
      const MELT_TRAIL_EM = 0.30;     // passo della scia, in em
      const MELT_TRAIL = 5;           // copie nella scia, a piena velocita'

      meltTheName();

      function meltTheName() {
        whenDocumentIsParsed(() => {
          const name = document.getElementById('intro-name');
          if (!name || prefersReducedMotion()) return;

          const glyphs = splitIntoGlyphs(name);
          const em = () => parseFloat(getComputedStyle(name).fontSize) || 16;
          const style = getComputedStyle(document.documentElement);
          const hold = parseFloat(style.getPropertyValue('--intro-hold-duration'));
          const melt = parseFloat(style.getPropertyValue('--intro-melt-duration'));

          const start = performance.now();
          requestAnimationFrame(function tick(now) {
            const elapsed = now - start;
            if (elapsed < hold) { requestAnimationFrame(tick); return; }

            // 0 -> 1 sul tratto di disfacimento, poi al cubo: il ritmo accelera
            const linear = Math.min(1, (elapsed - hold) / melt);
            const p = linear * linear * linear;

            const unit = em();
            glyphs.forEach((g) => applyMelt(g, p, unit));

            if (linear < 1) requestAnimationFrame(tick);
          });
        });
      }

      /* Una lettera per span, con un seme stabile: la stessa lettera si disfa
         sempre allo stesso modo, cosi' l'intro non e' diversa a ogni reload. */
      function splitIntoGlyphs(host) {
        const text = host.textContent;
        host.textContent = '';
        return Array.from(text).map((ch, i) => {
          const span = document.createElement('span');
          span.className = 'intro-glyph';
          span.textContent = ch;
          host.appendChild(span);
          const r = seeded(i);
          return {
            el: span,
            stretch: 0.4 + r(),        // quanto si allunga
            drift: r() * 2 - 1,        // in su o in giu'
            lag: 0.55 + r() * 0.45     // chi parte prima e chi dopo
          };
        });
      }

      /* Generatore deterministico (mulberry32): stesse lettere, stesso esito. */
      function seeded(i) {
        let a = (i + 1) * 0x9e3779b9 >>> 0;
        return function () {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function applyMelt(g, p, em) {
        const q = Math.min(1, p * g.lag);
        const scaleY = 1 + q * MELT_MAX_STRETCH * g.stretch;
        const shiftY = q * MELT_MAX_DRIFT_EM * em * g.drift;
        g.el.style.transform = 'translateY(' + shiftY.toFixed(2) + 'px) scaleY(' + scaleY.toFixed(3) + ')';
        g.el.style.textShadow = smear(q, g.drift, em);
      }

      /* La scia: copie sempre piu' distanti e sempre piu' scariche, nella stessa
         direzione in cui la lettera sta slittando. E' quello che nel video fa
         salire l'inchiostro piu' di quanto salga la sola altezza. */
      function smear(q, dir, em) {
        if (q <= 0) return 'none';
        const parts = [];
        for (let n = 1; n <= MELT_TRAIL; n++) {
          const offset = (q * MELT_TRAIL_EM * em * n * (dir >= 0 ? 1 : -1)).toFixed(1);
          const alpha = (0.5 * q * (1 - n / (MELT_TRAIL + 1))).toFixed(3);
          parts.push('0 ' + offset + 'px 0 rgba(255,255,255,' + alpha + ')');
        }
        return parts.join(', ');
      }
    })();
  </script>
</head>
<body>

  <!-- intro: sparisce da sé, decorativa -> nascosta agli screen reader -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-row">
      <span class="intro-cell intro-wordmark" id="intro-name">Lando Andrea</span>
      <span class="intro-cell intro-tagline">sito personale</span>
      <span class="intro-cell intro-year">2026</span>
    </div>
  </div>

  <!-- layer folders: absolute inset-0 overflow-hidden select-none z-10 -->
  <div class="folders-layer">
    <!-- area di clamp: top-0 left-0 bottom-[90px] right-[90px] -->
    <div class="folders-area" id="folders-area">

      <!-- index 0 — x .65 y .75, icona grigia, label "asterione" -->
      <a draggable="false" data-drag="true" data-index="0" class="folder-item"
         style="top:75%;left:65%;-webkit-touch-callout:none" href="nuthoughts.html">
        <img draggable="false" src="assets/folder-gray.png" width="64" height="64" class="pixelated">
        <span class="folder-label">asterione</span>
      </a>

      <!-- index 1 — x .55 y .15, icona Black, label U+200B, link a master.html -->
      <a draggable="false" data-drag="true" data-index="1" class="folder-item"
         style="top:15%;left:55.00000000000001%;-webkit-touch-callout:none" href="master.html">
        <img draggable="false" src="assets/folder-black.png" width="64" height="64" class="pixelated">
        <span class="folder-label">&#8203;</span>
      </a>

      <!-- index 2 — x .18 y .48, icona gialla, label "foto".
           Vive nel suo repo (Acci4i0/3Dgallery) e si apre al suo indirizzo:
           e' un'app Vite con un build da 26 MB, tenerla separata e' la scelta. -->
      <a draggable="false" data-drag="true" data-index="2" class="folder-item"
         style="top:48%;left:18%;-webkit-touch-callout:none" href="https://acci4i0.github.io/3Dgallery/">
        <img draggable="false" src="assets/folder-default.png" width="64" height="64" class="pixelated">
        <span class="folder-label">foto</span>
      </a>

      <!-- index 3 — x .5 y .5, stile Image 84x84, click -> modal, nessun href -->
      <div draggable="false" data-drag="true" data-index="3" class="folder-item folder-item--image"
           style="top:50%;left:50%;-webkit-touch-callout:none" id="image-item">
        <img draggable="false" src="assets/icon-168.png" width="84" height="84" class="pixelated">
      </div>


      <!-- index 5 — x .8 y .32, icona gialla, label "info" (aggiunta, non presente
           nell'originale). Vive nel suo repo (Acci4i0/crossword), come la cartella foto. -->
      <a draggable="false" data-drag="true" data-index="5" class="folder-item"
         style="top:32%;left:80%;-webkit-touch-callout:none" href="https://acci4i0.github.io/crossword/">
        <img draggable="false" src="assets/folder-default.png" width="64" height="64" class="pixelated">
        <span class="folder-label">info</span>
      </a>

    </div>
  </div>

  <!-- social bottom: fixed bottom-8, centrato.
       Ai lati due figure animate. Sono <button> veri, non div cliccabili: sono
       controlli, e vanno raggiunti da tastiera. L'aria-label distingue i due
       lati, altrimenti uno screen reader annuncerebbe due voci identiche.
       Lo sprite e' uno <span> interno aria-hidden: essendo separato dal bottone
       puo' sbordare fuori dal box durante l'animazione senza allargare l'area
       di click, che resta quella del blob a riposo. -->
  <div class="socialbar">
    <div class="socialbar-inner">
      <button type="button" class="figure" data-figure aria-label="Play the figure animation (left)">
        <span class="figure-sprite" aria-hidden="true"></span>
      </button>
      <span class="socialbar-links"><a class="social-link" href="mailto:lando.andrea04@gmail.com">mail</a> / <a class="social-link" href="https://instagram.com/andrelndo" target="_blank" rel="noreferrer">instagram</a> / <a class="social-link" href="https://github.com/Acci4i0" target="_blank" rel="noreferrer">github</a></span>
      <button type="button" class="figure" data-figure aria-label="Play the figure animation (right)">
        <span class="figure-sprite" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <!-- modal (Headless UI Dialog replica): nessuna animazione, block/hidden -->
  <div class="hidden" id="modal-root">
    <div class="modal-overlay" aria-hidden="true"></div>
    <div class="modal-center">
      <div class="modal-panel" id="modal-panel">
        <img src="assets/modal-1500.png" alt="" class="modal-image">
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
